{% extends "base.html" %}{% block title %}Submit observation | KCI{% endblock %}
{% block content %}<div class="page-heading"><div class="eyebrow">FIELD RESEARCH / NEW ENTRY</div><h1>Submit an observation</h1><p>Record what was observed and identify the source. New records enter the verification queue.</p></div>
<div class="form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-12"><label class="form-label">Observation title *</label><input class="form-control" name="title" maxlength="180" required placeholder="Briefly describe the issue or finding"></div>
<div class="col-md-6"><label class="form-label">Category *</label><select class="form-select" name="category" required><option value="">Choose category</option>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Date observed *</label><input class="form-control" type="date" name="observed_on" required></div>
<div class="col-md-6"><label class="form-label">Local Government Area *</label><input class="form-control" name="lga" required maxlength="100" placeholder="e.g. Gwale"></div>
<div class="col-md-6"><label class="form-label">Ward *</label><input class="form-control" name="ward" required maxlength="120" placeholder="Ward name"></div>
<div class="col-12"><label class="form-label">Observation details *</label><textarea class="form-control" name="description" rows="4" required placeholder="Separate direct observation from statements or assumptions."></textarea></div>
<div class="col-md-6"><label class="form-label">Source / person / location *</label><input class="form-control" name="source_name" required maxlength="180" placeholder="Identify where the information came from"></div>
<div class="col-md-6"><label class="form-label">Source type</label><select class="form-select" name="source_type"><option>Field observation</option><option>Community interview</option><option>Official record</option><option>Public report</option><option>Market observation</option><option>Other</option></select></div>
<div class="col-12"><label class="form-label">Evidence URL (optional)</label><input class="form-control" type="url" name="evidence_url" maxlength="500" placeholder="https://..."></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="{{ url_for('observations') }}">Cancel</a><button class="btn btn-primary">Submit for verification</button></div></form></div>{% endblock %}
